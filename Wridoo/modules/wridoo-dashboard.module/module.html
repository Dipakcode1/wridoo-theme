{% require_css %}
<style>
  .xb-corner-shape::before,
  .xb-corner-shape::after {
    background-image: url("{{ get_asset_url('../../assets/img/shape/corner-shape01.png') }}") !important;
  }
  .xb-corner-shape::after {
    background-image: url("{{ get_asset_url('../../assets/img/shape/corner-shape02.png') }}") !important;
  }
</style>
{% end_require_css %}

<section class="dashboard">
  <div class="container mxw-1330">
    <div class="fs-dashboard-wrapper xbFadeUpItem">
      <ul class="fs-dashboard-nav xb-corner-shape ul_li nav nav-pills" id="pills-tab-{{ name }}" role="tablist">
        {% for item in module.tabs %}
          <li class="nav-item" role="presentation">
            <button class="nav-link {% if loop.first %}active{% endif %}" id="pills-tab-{{ name }}-{{ loop.index }}" data-tab="pane-{{ name }}-{{ loop.index }}" type="button" role="tab">
              {% if loop.index == 1 %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
              {% elif loop.index == 2 %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              {% elif loop.index == 3 %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
              {% elif loop.index == 4 %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              {% else %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8L4 10.8l6.1 2L12 18.5l1.9-5.7 6.1-2-6.1-2L12 3zM5 3v4M3 5h4M19 17v4M17 19h4"/></svg>
              {% endif %}
              <span>{{ item.title }}</span>
            </button>
          </li>
        {% endfor %}
      </ul>
      
      <div class="tab-content fs-dashboard-img-wrap" id="pills-tabContent-{{ name }}">
        {% for item in module.tabs %}
          <div class="tab-pane fade {% if loop.first %}show active{% endif %}" id="pane-{{ name }}-{{ loop.index }}" role="tabpanel" {% if not loop.first %}style="display: none;"{% endif %}>
            <div>
              {% if item.image.src %}
                <img src="{{ item.image.src }}" alt="{{ item.image.alt }}">
              {% elif loop.index == 1 %}
                <img src="https://www.bitrix24.in/upload/optimizer/converted/images/content_en/solutions/industry/travel-crm-software/img-hero.1466w.png.webp" alt="{{ item.title }}">
              {% elif loop.index == 2 %}
                <img src="https://www.bitrix24.in/upload/optimizer/converted/images/content_en/solutions/industry/travel-crm-software/img-slider-1.1344w.jpg.webp" alt="{{ item.title }}">
              {% elif loop.index == 3 %}
                <img src="https://www.bitrix24.in/upload/optimizer/converted/images/content_en/solutions/industry/travel-crm-software/img-slider-2.1344w.jpg.webp" alt="{{ item.title }}">
              {% elif loop.index == 4 %}
                <img src="https://www.bitrix24.in/upload/optimizer/converted/images/content_en/solutions/industry/travel-crm-software/img-slider-3.1344w.jpg.webp" alt="{{ item.title }}">
              {% else %}
                <img src="https://www.bitrix24.in/upload/optimizer/converted/images/content_en/solutions/industry/travel-crm-software/img-slider-4.1344w.jpg.webp" alt="{{ item.title }}">
              {% endif %}
            </div>
          </div>
        {% endfor %}
      </div>
      <div class="xb-section-shape dashboard-shape">
        <div class="shape shape--1"><img src="{{ get_asset_url('../../assets/img/shape/das_shape03.png') }}" alt="shape"></div>
        <div class="shape shape--2"><img src="{{ get_asset_url('../../assets/img/shape/das_shape04.png') }}" alt="shape"></div>
        <div class="shape shape--3"><img src="{{ get_asset_url('../../assets/img/shape/das_shape01.png') }}" alt="shape"></div>
        <div class="shape shape--4"><img src="{{ get_asset_url('../../assets/img/shape/das_shape02.png') }}" alt="shape"></div>
        <div class="shape shape--5"><img src="{{ get_asset_url('../../assets/img/shape/circle-blur.png') }}" alt="blur"></div>
      </div>
    </div>
  </div>
</section>
